            secondCard.textContent = firstCard.textContent;

            const copyCard = document.createElement("button");

            copyCard.className = "bg-slate-200 rounded border font-bold text-slate-800 flex justify-center items-center aspect-square focus:bg-blue-500 focus:text-white";

            }else {

                copyCard.classList.remove("rotate-180");
            }

            copyCard.addEventListener("click",(event)=>{

            });

            justify.appendChild(copyCard);

        //自分の持ち駒を盤面に配置するときの挙動
        function haiti (firstCard,secondCard){
            secondCard.textContent = firstCard.textContent;
            secondCard.dataset.team = firstCard.dataset.team;
            firstCard.classList.add("hidden");

            if (firstCard.dataset.team === "A") {
                secondCard.classList.add("rotate-180");
            } else {

            }

            firstCard.blur();
            secondCard.blur();
        }

                card.id=`mass_${x}_${y}`;

                ban.appendChild(card);
            }

        const Allgather = [...TeamA,...TeamB];
        Allgather.forEach((pieces)=>{
            const targeter =document.querySelector(`#mass_${pieces.x}_${pieces.y}`);
            
            if(targeter){
                targeter.textContent = pieces.name;

                if(TeamA.includes(pieces)){
                    targeter.classList.add("rotate-180");
                    targeter.dataset.team="A";
                }else{
                    targeter.dataset.team="B";
                }
            }
        });


        //駒を実際に動かしたときの挙動
        function handleCardClick(currentCard){
            if (isGameOver)return;
            
            //一手目
            if (firstId === null){
                //空白を選択したとき
                if (currentCard.textContent === ""&&!currentCard.dataset.moti){
                    currentCard.blur();
                    return;
                }
                //持ち駒をクリックしたとき
                if(!currentCard.id){
                    currentCard.id = `moti_${Date.now()}_${Math.random().toString(36).substring(2,9)}`;
                }
                firstId = currentCard.id;
                console.log("1" + firstId);

            //二手目
            }else {
                const secondId = currentCard.id;
                console.log("2" + secondId);

                const firstCard = document.getElementById(firstId);
                const secondCard= document.getElementById(secondId);

                //同じ駒をクリックしたとき
                if (firstCard === secondCard){
                    if(firstId.startsWith("moti_")){
                        firstCard.removeAttribute("id");
                    }
                    firstCard.blur();
                    secondCard.blur();
                    firstId = null;
                    return;
                }

                //正常にクリックできたとき
                if (firstCard && secondCard){
                    //持ち駒を盤面に配置する場合
                    if(firstCard.id.startsWith("moti_")){
                        if(secondCard.id.startsWith("mass_")&&secondCard.textContent===""){
                            //二歩の禁止

                        }else{

                            firstCard.blur();
                            secondCard.blur()
                        }
                        firstId=null;
                        return;
                    }

                    //駒を空白に移動させる場合

                        koukan (firstCard,secondCard);
                    //味方の駒を取ろうとしたとき
                    } else if (firstCard.dataset.team === secondCard.dataset.team){
                        firstCard.blur();

                        firstId = null;
