        let firstId = null;

        for (let y=1;y<=9;y++){
            for(let x=1;x<=9;x++){
                const card = document.createElement("button");
                card.className = "bg-slate-200 rounded border focus:bg-blue-500 focus:text-white"
                card.textContent = "";

                card.id=`mass_${x}_${y}`;

                ban.appendChild(card);
            }
        }

        const Allgather = [...TeamA,...TeamB];

        Allgather.forEach((pieces)=>{
            const targeter =document.querySelector(`#mass_${pieces.x}_${pieces.y}`);
            
            if(targeter){
                targeter.textContent = pieces.name;

                if(TeamA.includes(pieces)){
                    targeter.classList.add("rotate-180");
                    targeter.dataset.team="A";
                    targeter.dataset.team="B";
                }
            }
        });

        document.querySelectorAll("#ban button").forEach((card,index)=>{
            card.addEventListener("click",(event)=>{
                if (firstId === null){
                    if (event.target.textContent === ""){
                        return;
                    }
                    firstId = event.target.id;
                    console.log("1" + firstId);

                    //firstIdの駒の種類によって進める先を黒点で表示する
                }else {
                    const secondId = event.target.id;
                    console.log("2" + secondId);

                    const firstCard = document.querySelector("#"+firstId);
                    const secondCard= document.querySelector("#"+secondId);

                    if (firstCard === secondCard){
                        firstCard.blur();
                        secondCard.blur();
                        firstId = null;
                        return;
                    }

                    if (firstCard && secondCard){
                        if (secondCard.textContent ===""){
                            const nextCardfirst  =firstCard.nextSibling;
                            const nextCardsecond =secondCard.nextSibling;
                            ban.insertBefore (firstCard,nextCardsecond);
                            ban.insertBefore (secondCard,nextCardfirst);
                            firstCard.id = secondId;
                            secondCard.id= firstId; 

                            firstCard.blur();
                            secondCard.blur();
                        } else if (firstCard.dataset.team === secondCard.dataset.team){
                            firstCard.blur();
                            secondCard.blur();
                            firstId = null;
                            return;
                        }else {
                            const nextCardfirst  =firstCard.nextSibling;
                            const nextCardsecond =secondCard.nextSibling;
                            ban.insertBefore (firstCard,nextCardsecond);
                            ban.insertBefore (secondCard,nextCardfirst);
                            firstCard.id = secondId;
                            secondCard.id= firstId; 

                            firstCard.blur();
                            secondCard.blur();
                        }
                    }
                    firstId =null;
                }
            });
