<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDolist</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6">TODOリスト</h1>

    <div class="flex gap-2 mb-6">
        <input id="todoInput" type="text" placeholder="タスクを入力..."
        class="flex-1 border border-gray-300 rounded px-3 py-2">
        <button id="addBtn"
        class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">
        追加
        </button>
    </div>

    <ul id="todoList" class="space-y-2"></ul>
    </div>


    <!--タスクを入力のidは  todoInput-->
    <!--追加ボタンのidは    addBtn-->
    <!--追加先のリストのidは todoList-->
    <script>
    const todoButton = document.querySelector("#addBtn");
    const todoInput = document.querySelector("#todoInput");
    const todoList = document.querySelector("#todoList");

    todoButton.addEventListener("click", () => {
        const text = todoInput.value;

        if (text===" "){
            return;
        }

        const item = document.createElement("li");
        item.className="bg-gray-200 flex flex-row items-center justify-between rounded shadoe px-5 py-3";

        const span =document.createElement("span");
        span.textContent=text;

        const finish =document.createElement("button");
        finish.className="text-sm text-gray-700 hover:text-red-500"
        finish.textContent="完了"

        finish.addEventListener("click",()=>{
            span.classList.toggle("text-gray-500");
            span.classList.toggle("line-through");
        });

        item.appendChild(span);
        item.appendChild(finish);
        todoList.appendChild(item);

        todoInput.value=" ";
    });
    </script>
</body>
</html>
