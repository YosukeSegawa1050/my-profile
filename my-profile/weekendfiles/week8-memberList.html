<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemberList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <h1 class="text-2xl p-5">メンバーリスト</h1>

    <!--フィルター用ボタン-->
    <div class="flex gap-5 px-5">
        <ul id="filter" class="flex gap-5"></ul>
        <button id="youso" class="bg-gray-300 rounded px-5 py-2 hover:bg-gray-400">フィルター追加</button>
    </div>

    <!--要素追加時に出現する入力欄-->
    <div id="input" class="flex items-center gap-1 px-5 pt-5 hidden">
        <label>らべる</label>
        <input id="HIRAGANA" type="text" placeholder="ひらがな"
            class="rounded pr-5 pl-2 py-2 mr-10">

        <label>ラベル</label>
        <input id="KATAKANA" type="text" placeholder="カタカナ"
            class="rounded pr-5 pl-2 py-2 mr-10">

        <label>Label</label>
        <input id="English" type="text" placeholder="English"
            class="rounded pr-5 pl-2 py-2 mr-10">

        <button id="tuika" class="bg-blue-500 text-white rounded-xl hover:bg-blue-700 px-5 py-2 ml-10">要素追加</button>
    </div>

    <!--新しくカードを作るための入力欄-->
    <div class="flex items-center gap-1 px-5 pt-5">
        <label>名前</label>
        <input id="name" type="text" placeholder="例：山田 太郎"
            class="rounded pr-5 pl-2 py-2 mr-10">

        <label>仕事</label>
        <input id="role" type="text" placeholder="例：公務員"
            class="rounded pr-5 pl-2 py-2 mr-10">

        <label>コメント</label>
        <input id="comment" type="text" placeholder="例：お客様一人一人に丁寧に対応することを理念としています。"
            class="w-1/3 rounded pr-2 pl-2 py-2">

        <button id="button" class="bg-blue-500 text-white rounded-xl hover:bg-blue-700 px-5 py-2 ml-10">追加</button>
    </div>
    <h2 id="warn" class="px-5 text-xl text-red-500"></h2>
    <div id="li"></div>



    <script>
        //ボタンの定義
        const filter = document.querySelector("#filter");
        const youso = document.querySelector("#youso");
        const input = document.querySelector("#input");
        const tuika = document.querySelector("#tuika")
        const button = document.querySelector("#button");
        const warn = document.querySelector("#warn");
        const li = document.querySelector("#li");

        //もとからあるメンバーリスト
        const members = [
        {name:"山田太郎",role:"エンジニア",comment:"趣味はピアノです"},
        {name:"佐々木小次郎",role:"ピアニスト",comment:"趣味は絵のデザインです"},
        {name:"大熊大河",role:"デザイナー",comment:"趣味はアニメ鑑賞です"},
        {name:"山口幾多郎",role:"アニメライター",comment:"趣味は天体観測です"},
        {name:"石神百夜",role:"宇宙飛行士",comment:"趣味はエンジニアリングです"}
        ];

        //フィルター要素を定義
        const buttons = [
            {hira:ぜんいん,kata:ゼンイン,eng:all},
            {hira:えんじにあ,kata:エンジニア,eng:engineer},
            {hira:でざいなー,kata:デザイナー,emg:designer}
        ];

        //もとからあるメンバーをカード形式に表示＆変数化
        const displayMembers = (memberList) => {
            li.textContent = ""

            memberList.forEach((member)=>{
            const card = document.createElement("div");
            card.className = "bg-white rounded shadow p-5 m-5"

            card.innerHTML=`
            <h2 class="text-lg font-bold">${member.name}</h2>
            <p class="text-sm text-blue-600 mt-2">${member.role}</p>
            <p class="text-gray-600 mt-2">${member.comment}</p>
            `;
            li.appendChild(card);
            });
        };

        //要素追加をカード形式に表示＆変数化
        const displayYouso = (memberYouso)=>{
            filter.textContent = ""

            memberYouso.forEach((item)=>{
            const ink = document.createElement("button");
            ink.className = "bg-gray-300 rounded px-5 py-2 hover:bg-gray-400";
            ink.textContent = item.kana;

            filter.appendChild(ink);
            });
        }

        //今作用しているボタンの色だけ変える(changeButtonColorを定義)
        const changeButtonColor = (activeButton) => {
            members.forEach((btn)=>{
                btn.className="bg-gray-300 rounded px-5 py-2 hover:bg-gray-400";
            });
            activeButton.className = "bg-emerald-400 rounded px-5 py-2 hover:bg-emerald-500";
        };
        
        //最初のメンバーのカードを表示
        displayMembers(members);

        //最初のフィルターボタンを表示
        displayYouso(buttons);

        //追加ボタンを押したときに、入力欄に入れた人のカードを新しく作る
        button.addEventListener("click",()=>{
            const name = document.querySelector("#name").value;
            const role = document.querySelector("#role").value;
            const comment = document.querySelector("#comment").value;

            //入力がされていない場合に注意文を出す
            if (name==="" || role==="" || comment===""){
                warn.textContent="名前・仕事・コメントを入力してください";
                return;
            }

            //注意文を消す
            warn.textContent=""

            //変数membersに新しく追加する人の情報を追加する
            members.push({name:name,role:role,comment:comment});

            //改めて全員のカードを表示する
            displayMembers(members);

            //新しく追加した人のカードが画面の一番下に表示されるように画面が動く
            li.lastElementChild.scrollIntoView({ behavior: "smooth", block: "end" });

            //全員ボタンの色が変わる(changeButtonColorは変数)
            changeButtonColor(every);

            //入力欄をきれいにする
            document.querySelector("#name").value = "";
            document.querySelector("#role").value = "";
            document.querySelector("#comment").value = "";
        });

        //フィルター追加ボタンを押したときにフィルターを追加する
        tuika.addEventListener("click",()=>{
            const hiragana = document.querySelector("#HIRAGANA").value;
            const katakana = document.querySelector("#KATAKANA").value;
            const english = document.querySelector("#English").value;

            if (hiragana==="" || katakana==="" || english===""){
                warn.textContent = "ひらがな・カタカナ・英語を全て入力してください";
                return;
            }

            //注意文を消す
            warn.textContent = ""
            
            //表示をカタカナにす
            buttons.push(katakana);

            //改めて表示する
            displayYouso(buttons);

            //入力欄をきれいにする
            document.querySelector("#HIRAGANA").value = "";
            document.querySelector("#KATAKANA").value = "";
            document.querySelector("#English").value = "";
        });

        //フィルター追加のボタンを押したとき入力欄を出現させる
        youso.addEventListener("click",()=>{
            input.classList.toggle("hidden");
        });

        ink.addEventListener("click",()=>{
            const aft = Youso.filter 
        });
    </script>
</body>
</html>
